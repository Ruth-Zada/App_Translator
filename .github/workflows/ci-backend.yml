name: CI Backend Pipeline

on:
  push:
    branches: [main, ci/cd]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  # שלב 1: בדיקות יוניט
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
    
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
    
      - name: Run unit tests
        working-directory: ./backend
        run: npm test
    
      - name: Test summary
        run: echo "✅ Unit tests completed successfully"

  # שלב 2: בניית האימג' ובדיקתו
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'ruth630' }}/app-translator-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'ruth630' }}/app-translator-backend:${{ github.sha }}
          load: true
    
      - name: Test Docker image
        run: |
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/app-translator-backend:${{ github.sha }} node --version
          echo "✅ Docker image builds and runs!"

  # שלב 3: בדיקות אינטגרציה
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/ci/cd' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
    
      - name: Run tests with Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from backend-test
    
      - name: Show logs
        if: always()
        run: docker compose -f docker-compose.test.yml logs
    
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # שלב 4: העלאה ל-DockerHub
  push:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cd') &&
      needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-translator-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-translator-backend:${{ github.sha }}

  # שלב 5: בונוס - יצירת Tag בגיט
  tagging:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && needs.push.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=$(echo $LATEST_TAG | sed 's/v//')
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
    
      - name: Create and push tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  # שלב 6: Deploy
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cd') &&
      needs.push.result == 'success'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd App_Translator
            git pull
            docker compose up -d --build
            echo "Deployed successfully"